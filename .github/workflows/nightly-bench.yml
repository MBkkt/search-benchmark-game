name: Nightly benchmark

# Runs the full turbopuffer-comparison bench on a dedicated 8 vCPU / 16 GiB
# Sapphire Rapids box, commits results.json to master, and lets the existing
# pages.yml publish the dashboard.
#
# The box is a GCP c3-highcpu-8 by default. The AWS c7i.2xlarge the nightly
# used to run on is still fully supported — dispatch with `cloud: aws` to get
# it back. The two are the same CPU generation, core count and memory, but
# they are not the same machine: see README's benchmark-environment section.
# Everything cloud-specific lives in scripts/bench-cloud.sh (runner side) and
# scripts/cloud-shim-{gcp,aws}.sh (box side), so this workflow stays one path.
# The nightly benches two infino columns: `infino-0.11.7` (the published crate)
# and `infino-main` (the tip of infino-ai/infino main). `infino-platform`
# (infino on the hosted platform) is opt-in: a dispatch with `platform: compare`
# adds it to that run's engines, and the scheduled nightly never includes it.
# See README.
#
# workflow_dispatch accepts an optional `infino_branch` input. When set to
# anything other than "main", the dispatched ref is benched as the
# `infino-branch` engine — by default alongside `infino-main` + lucene/tantivy
# on one instance, or alone with `same_box: false` (tantivy/lucene skipped,
# ~30 min saved). The nightly results.json/results-full.json are NOT
# overwritten; instead the run (1) posts a comparison vs the committed main
# baseline to the job summary, and (2) publishes a per-fork dashboard page at
# <fork_user>/full showing this branch's infino column alongside the baseline
# engines. Each fork's page is keyed by fork owner, so the latest branch run
# from that fork overwrites it. The page is committed under web/build/, which
# pages.yml then deploys.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      infino_branch:
        description: 'infino branch to bench (default: main)'
        default: 'main'
        required: false
      infino_repo:
        description: 'infino repo to bench, e.g. a public fork (default: infino-ai/infino)'
        default: 'infino-ai/infino'
        required: false
      cloud:
        description: 'Cloud to bench on. gcp = c3-highcpu-8 (default); aws = the original c7i.2xlarge.'
        type: choice
        options: [gcp, aws]
        default: gcp
        required: false
      same_box:
        description: 'Same-box A/B: bench lucene/tantivy alongside infino-branch + infino-main on one instance (variance-free branch-vs-main / branch-vs-lucene). Default on; off trims the run to the infino-branch column alone, compared cross-run against the committed baseline. Does not apply to a main run — infino-main already covers main.'
        type: boolean
        default: true
        required: false
      platform:
        description: 'infino-platform (infino on the hosted platform). off = no platform column (default; the scheduled nightly is always off). compare = add the column to this run''s engines; published like the rest of the run (a main run publishes to the official results until the next nightly). only = bench it alone and publish nothing (latency to the job summary). compare and only fail if the platform secrets are missing.'
        type: choice
        options: ['off', compare, only]
        default: 'off'
        required: false

permissions:
  id-token: write   # keyless OIDC federation into GCP (or AWS)
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      # The scheduled run passes no inputs, so this is where the nightly's
      # default cloud is set; the input only overrides a dispatch.
      BENCH_CLOUD: ${{ inputs.cloud || 'gcp' }}
      INFINO_BRANCH: ${{ inputs.infino_branch || 'main' }}
      INFINO_REPO: ${{ inputs.infino_repo || 'infino-ai/infino' }}
      # On by default (input default true); the nightly schedule has no inputs so
      # this is 'false' there, and a main run skips the baseline regardless (see the
      # IS_BRANCH_RUN guard in user-data).
      SAME_BOX: ${{ inputs.same_box && 'true' || 'false' }}
      # The scheduled run has no inputs, so it is always off.
      PLATFORM: ${{ inputs.platform || 'off' }}

    steps:
      # Full history, not the default depth-1. The publish steps below rebase
      # this ref onto remote master before pushing; with a shallow clone there
      # is no merge base, so git cannot 3-way merge and reports every file that
      # differs as an add/add conflict. That is invisible on a branch carrying
      # only the page commit, and fatal on one that also carries a source
      # change — which a branch benching an API-breaking engine change always
      # does.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Short-lived token covering both repos (clone infino + push results)
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: infino-ai
          repositories: "search-benchmark-game,infino"

      # Each cloud's credential step is necessarily its own; everything after
      # this point is cloud-neutral and goes through scripts/bench-cloud.sh.
      - name: Federate to GCP (Workload Identity — no stored keys)
        if: env.BENCH_CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          # Deliberately no `token_format: access_token`: that bakes a static
          # token which, capped at one hour, would expire partway through the
          # poll below and hang the run to its timeout despite a good bench
          # (the exact failure the AWS path's role-duration override fixes).
          # The default credentials file instead re-mints a GitHub OIDC
          # assertion on every refresh, so it stays valid for the whole job.
          workload_identity_provider: projects/309265046192/locations/global/workloadIdentityPools/github-pool/providers/search-benchmark-game
          service_account: sbg-bench-ci@infino-dev-ci.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        if: env.BENCH_CLOUD == 'gcp'

      - name: Configure AWS credentials (OIDC — no stored keys)
        if: env.BENCH_CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381491836522:role/sbg-ci
          aws-region: us-east-1
          # The wait step polls for the whole bench; the default 1 h OIDC
          # session expires mid-run once a bench exceeds an hour, and the poll
          # then fails silently -> the run hangs to the timeout despite a
          # successful bench. Hold credentials past the 3 h wait timeout.
          # (sbg-ci's max session duration must allow this.)
          role-duration-seconds: 14400

      # Clean up any leftover done-signal from a previous failed run
      - name: Clear stale done-signal
        run: scripts/bench-cloud.sh clear-signal

      # Splice the chosen cloud's box shim into the template and substitute
      # the run parameters. The script syntax-checks what it generates, so a
      # broken box script fails here rather than silently on a booted VM.
      - name: Build box startup script
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SBG_BRANCH: ${{ github.ref_name }}
        run: scripts/bench-cloud.sh build-user-data /tmp/user-data.sh

      - name: Launch bench instance
        id: box
        run: |
          HANDLE=$(scripts/bench-cloud.sh launch /tmp/user-data.sh)
          echo "handle=$HANDLE" >> "$GITHUB_OUTPUT"
          echo "Launched $BENCH_CLOUD bench box: $HANDLE"

      # Poll every 60 s; bench typically finishes in ~2 h.
      # GitHub-hosted jobs are hard-capped at 6 h, and a job killed by that
      # cap skips the `always()` cleanup below, leaving the EC2 instance
      # running. Keep the wait a little under the cap so the step fails
      # normally and the instance is still terminated.
      - name: Wait for benchmark to complete (5 h 45 m timeout)
        timeout-minutes: 345
        run: scripts/bench-cloud.sh wait

      - name: Fetch box logs on failure
        if: failure()
        run: |
          echo "=== Benchmark box log ($BENCH_CLOUD) ===" | tee bench-output.log
          scripts/bench-cloud.sh fetch-log | tee -a bench-output.log

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench-output.log
          retention-days: 7

      - name: Download results
        run: |
          if [ "$PLATFORM" = "only" ]; then
            scripts/bench-cloud.sh fetch results-full-platform-check.json results-full-platform-check.json
          elif [ "$INFINO_BRANCH" = "main" ] && [ "$INFINO_REPO" = "infino-ai/infino" ]; then
            scripts/bench-cloud.sh fetch results.json      results.json
            scripts/bench-cloud.sh fetch results-full.json results-full.json
          else
            RUN_SLUG="${INFINO_REPO//\//-}-${INFINO_BRANCH//\//-}"
            scripts/bench-cloud.sh fetch "results-branch-${RUN_SLUG}.json"      "results-branch-${RUN_SLUG}.json"
            scripts/bench-cloud.sh fetch "results-full-branch-${RUN_SLUG}.json" "results-full-branch-${RUN_SLUG}.json"
          fi

      # Platform check: per-command latency of the infino-platform column, from
      # the platform's x-infino-query-time header, to the job summary.
      - name: Summarize platform check
        if: env.PLATFORM == 'only'
        run: |
          python3 - results-full-platform-check.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, math, statistics, sys
          r = json.load(open(sys.argv[1]))
          print("### infino-platform check (x-infino-query-time)\n")
          if r.get("run", {}).get("failed_engines"):
              print("**Failed:** `%s`\n" % r["run"]["failed_engines"])
          print("| command | queries | p50 (us) | p90 (us) | mean (us) |")
          print("|---|---:|---:|---:|---:|")
          for command, engines in r["results"].items():
              per_query = [statistics.median(q["duration"]) for q in engines.get("infino-platform", []) if q.get("duration")]
              if not per_query:
                  print("| %s | 0 | - | - | - |" % command)
                  continue
              per_query.sort()
              print("| %s | %d | %d | %d | %d |" % (command, len(per_query),
                  statistics.median(per_query), per_query[math.ceil(0.9 * len(per_query)) - 1],
                  statistics.mean(per_query)))
          PY

      # Branch runs: compare the infino-branch column vs the committed main
      # baseline's infino-main column (see scripts/compare_results.py) and
      # post a markdown table to the job summary. No commit to master.
      - name: Compare branch results vs main
        if: env.PLATFORM != 'only' && (env.INFINO_BRANCH != 'main' || env.INFINO_REPO != 'infino-ai/infino')
        run: |
          RUN_SLUG="${INFINO_REPO//\//-}-${INFINO_BRANCH//\//-}"
          RUN_LABEL="${INFINO_REPO}@${INFINO_BRANCH}"
          python3 scripts/compare_results.py \
            results.json \
            "results-branch-${RUN_SLUG}.json" \
            --label "$RUN_LABEL" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare_results.py \
            results-full.json \
            "results-full-branch-${RUN_SLUG}.json" \
            --label "$RUN_LABEL (full 962-query)" \
            >> "$GITHUB_STEP_SUMMARY"

      # Branch/fork runs: build a per-fork /full-style dashboard page that shows
      # this branch's infino column spliced into the committed baseline (which
      # carries tantivy/lucene + main's infino). It lives at <fork_user>/full;
      # the latest branch run from a fork overwrites that fork's page.
      - name: Build fork full-benchmark page
        if: env.PLATFORM != 'only' && (env.INFINO_BRANCH != 'main' || env.INFINO_REPO != 'infino-ai/infino')
        id: fork-page
        run: |
          RUN_SLUG="${INFINO_REPO//\//-}-${INFINO_BRANCH//\//-}"
          FORK_USER="${INFINO_REPO%%/*}"
          echo "fork_user=$FORK_USER" >> "$GITHUB_OUTPUT"
          python3 scripts/publish_branch_full.py \
            --main-full   results-full.json \
            --branch-full "results-full-branch-${RUN_SLUG}.json" \
            --template    web/build/full/index.html \
            --out-dir     "web/build/${FORK_USER}/full" \
            --label       "${INFINO_REPO}@${INFINO_BRANCH}"
          # Same-box run: also publish the raw multi-engine results
          # (infino-branch + infino-main + lucene/tantivy, all benched on one
          # instance) so
          # branch-vs-main / branch-vs-lucene are fetchable and variance-free.
          if [ "$SAME_BOX" = "true" ]; then
            cp "results-full-branch-${RUN_SLUG}.json" \
              "web/build/${FORK_USER}/full/samebox-results.json"
          fi

      # Fresh token scoped to the SBG repo for the page push (the app-token from
      # launch has likely expired after the ~2 h bench).
      - name: Generate token to push fork page
        if: env.PLATFORM != 'only' && (env.INFINO_BRANCH != 'main' || env.INFINO_REPO != 'infino-ai/infino')
        uses: actions/create-github-app-token@v1
        id: fork-push-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: infino-ai
          repositories: "search-benchmark-game"

      - name: Commit and push fork page
        if: env.PLATFORM != 'only' && (env.INFINO_BRANCH != 'main' || env.INFINO_REPO != 'infino-ai/infino')
        run: |
          FORK_USER="${{ steps.fork-page.outputs.fork_user }}"
          PAGE_DIR="web/build/${FORK_USER}/full"
          git config user.name  "sbg-ci"
          git config user.email "sbg-ci@infino.ai"
          # Remove actions/checkout's credential helper so the App token in the
          # push URL is used instead of the default GITHUB_TOKEN.
          git config --unset-all http.https://github.com/.extraheader || true
          PUSH_URL="https://x-access-token:${{ steps.fork-push-token.outputs.token }}@github.com/infino-ai/search-benchmark-game.git"

          # Publish ONLY the generated page. A branch run is checked out at the
          # dispatched branch, which for an engine-API change also carries the
          # source commits that made the wrapper compile. Committing on that
          # HEAD and pushing HEAD:master shipped those commits to master as a
          # side effect of publishing a result — a benchmark run must not be a
          # code-merge path.
          #
          # So the page is lifted out of the work tree, master is checked out
          # fresh, and the page is replayed onto it: the pushed commit's tree
          # is master's tree plus web/build/<fork>/full/**, and nothing else
          # from the branch can ride along. This also removes the rebase, and
          # with it the add/add conflicts a rebase hit whenever the branch
          # carried a source change.
          STAGE="$(mktemp -d)"
          cp -a "$PAGE_DIR/." "$STAGE/"

          for attempt in 1 2 3 4 5; do
            # master can advance during the ~2 h bench (e.g. a merged PR), so
            # re-read it on every attempt and rebuild the commit on top.
            git fetch "$PUSH_URL" master
            git checkout -f -B sbg-page-push FETCH_HEAD
            rm -rf "$PAGE_DIR"
            mkdir -p "$PAGE_DIR"
            cp -a "$STAGE/." "$PAGE_DIR/"
            git add -A "$PAGE_DIR"
            if git diff --cached --quiet; then
              echo "fork page unchanged — nothing to push"
              exit 0
            fi
            git commit -m "pages: ${INFINO_REPO}@${INFINO_BRANCH} full-benchmark run"
            if git push "$PUSH_URL" HEAD:master; then
              echo "pushed fork page on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — remote advanced, retrying…"
            sleep 5
          done
          echo "failed to push fork page after 5 attempts" >&2
          exit 1

      # The initial app-token may have expired (bench takes ~2 h, token lasts 1 h).
      # Generate a fresh one just for the push.
      - name: Generate fresh token for push
        if: env.PLATFORM != 'only' && (env.INFINO_BRANCH == 'main' && env.INFINO_REPO == 'infino-ai/infino')
        uses: actions/create-github-app-token@v1
        id: push-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: infino-ai
          repositories: "search-benchmark-game"

      - name: Commit and push results
        if: env.PLATFORM != 'only' && (env.INFINO_BRANCH == 'main' && env.INFINO_REPO == 'infino-ai/infino')
        run: |
          git config user.name  "sbg-ci"
          git config user.email "sbg-ci@infino.ai"
          git add results.json results-full.json
          git diff --cached --quiet && echo "results unchanged — nothing to push" && exit 0
          git commit -m "bench: $(date -u +%F) nightly results"
          # Remove the credential helper installed by actions/checkout so our
          # App token in the push URL is used instead of the default GITHUB_TOKEN.
          git config --unset-all http.https://github.com/.extraheader || true
          PUSH_URL="https://x-access-token:${{ steps.push-token.outputs.token }}@github.com/infino-ai/search-benchmark-game.git"
          # The bench runs for ~1 h, during which master can advance (e.g. a
          # merged PR). A plain push would be rejected as non-fast-forward, so
          # rebase the results commit onto the latest remote master before
          # pushing. The results commit only touches results*.json, so it
          # rebases cleanly over code changes. Retry to absorb a lost race.
          for attempt in 1 2 3 4 5; do
            git fetch "$PUSH_URL" master
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "rebase onto remote master failed" >&2
              exit 1
            fi
            if git push "$PUSH_URL" HEAD:master; then
              echo "pushed results on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — remote advanced, retrying…"
            sleep 5
          done
          echo "failed to push results after 5 attempts" >&2
          exit 1

      # Always clean up — even if the bench or push step failed
      - name: Delete done-signal
        if: always()
        run: scripts/bench-cloud.sh clear-signal

      - name: Terminate bench instance
        if: always()
        run: scripts/bench-cloud.sh terminate "${{ steps.box.outputs.handle }}"
