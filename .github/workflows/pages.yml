name: Deploy benchmark site

# Publishes the dashboard to https://infino-ai.github.io/search-benchmark-game
# whenever an updated results.json, page or page source lands on master.
#
# The page bundle is built here from web/src on every deploy, and every page
# under web/build is restamped to point at it (web/build.sh). A bundle
# committed by hand goes stale the first time someone edits web/src and does
# not rebuild, and nothing notices: the site keeps serving the old script.

on:
  push:
    branches: [master]
    paths:
      - results.json
      - results-full.json
      - web/build/**
      - web/src/**
      - web/public/**
      - web/package.json
      - web/package-lock.json
      - web/build.sh
      - scripts/stage_site.py
      - scripts/publish_branch_full.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # react-scripts 3.4.3 and node-sass 4.14.1, as locked, install on Node 14
      # and not on anything current.
      - uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the page bundle and point every page at it
        run: web/build.sh
      - name: Stage results into the prebuilt site
        run: |
          # full 962-query benchmark → root and /full dashboards
          [ -f results-full.json ] && cp results-full.json web/build/results.json      || echo "no results-full.json; using committed fallback"
          [ -f results-full.json ] && cp results-full.json web/build/full/results.json || echo "no results-full.json; /full will use committed fallback"
          # turbopuffer comparison → /tpuf dashboard
          [ -f results.json ]      && cp results.json      web/build/tpuf/results.json || echo "no results.json; /tpuf will use committed fallback"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build
      - id: deploy
        uses: actions/deploy-pages@v4
