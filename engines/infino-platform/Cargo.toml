[package]
name = "infino-platform-bench"
version = "0.1.0"
edition = "2024"

# infino on the hosted platform. There is no local index: build_index loads the
# corpus into a hosted table and do_query sends each query over HTTPS.
[lib]
name = "infino_platform"
path = "src/lib.rs"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"

[[bin]]
name = "do_query"
path = "src/bin/do_query.rs"

[dependencies]
# The published crate with its `remote` client, pinned to the release the
# hosted platform runs, so the client and the server speak the same API
# (Cargo.lock records the same version).
infino = { version = "=0.11.2", features = ["remote"] }
arrow-array = "58"
arrow-schema = "58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Queries are sent directly to read the platform's query-time header; same
# client and TLS as infino's `remote` feature.
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1
